<!DOCTYPE html>
<!--
  anmeldeseite.html — ein Feld, Token hinein, fertig.

  Eine eigenständige Datei, vom Python-Dienst ausgeliefert, NICHT Teil des
  SvelteKit-Baus. Zwei Gründe: sie muss vor der Anmeldung erreichbar sein, und
  sie aus dem Frontend-Bau herauszuhalten lässt diesen unangetastet — dieselbe
  Tugend, die HTTP Basic hatte.

  Alles inline: kein Bauschritt, keine Datei daneben, keine CDN-Abhängigkeit.
  Wer sie ändert, braucht nichts als einen Texteditor.

  {{FEHLER}} und {{WEITER}} setzt server/anmeldung.py ein. Beide werden dort
  maskiert — hier steht nichts, was ungeprüft aus dem Netz käme.
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden — BER Chronik</title>
<style>
  :root {
    --c-bg: #f4f3f0;
    --c-surface: #fff;
    --c-border: #e5e2dc;
    --c-text: #1a1a1a;
    --c-text-2: #555;
    --c-text-3: #888;
    --c-primary: #6d28d9;
    --c-primary-h: #5b21b6;
    --c-danger: #dc2626;
    --c-danger-bg: #fef2f2;
    --c-danger-border: #fca5a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--c-bg);
    color: var(--c-text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px;
  }
  main {
    width: 100%;
    max-width: 25em;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 9px;
    padding: 26px 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 600;
  }
  .unterzeile {
    margin: 0 0 20px;
    color: var(--c-text-2);
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--c-text-3);
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--c-border);
    border-radius: 6px;
    font: inherit;
    /* Der Token ist eine Folge aus Ziffern und Buchstaben. In einer
       Proportionalschrift sind 0/O und 1/l nicht zu unterscheiden, und wer ihn
       abtippt, tippt ihn falsch. */
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  input:focus {
    outline: none;
    border-color: var(--c-primary);
    box-shadow: 0 0 0 3px #ede9fe;
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 9px;
    border: 0;
    border-radius: 6px;
    background: var(--c-primary);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--c-primary-h); }
  .fehler {
    margin-bottom: 16px;
    padding: 9px 11px;
    background: var(--c-danger-bg);
    border: 1px solid var(--c-danger-border);
    border-radius: 6px;
    color: var(--c-danger);
    font-size: 13px;
  }
  .fuss {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--c-border);
    color: var(--c-text-3);
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>BER Chronik</h1>
  <p class="unterzeile">Zugang mit einem persönlichen Token.</p>

  {{FEHLER}}

  <form method="post" action="/anmelden">
    <!-- Wohin nach der Anmeldung. Kommt aus der Umleitung und wird im Server
         geprüft: nur Pfade auf diesem Dienst, keine fremden Adressen. -->
    <input type="hidden" name="weiter" value="{{WEITER}}">
    <label for="token">Token</label>
    <!--
      type="password", damit er nicht über der Schulter mitzulesen ist.
      autocomplete="current-password" lässt den Passwortspeicher ihn behalten —
      sonst tippt ihn jeder bei jedem Ablauf neu ab, und lange Zufallsfolgen
      werden dann durch kurze ersetzt.
      Kein Benutzernamenfeld: es gibt keinen. Genau das war der Grund, das
      Browserfenster abzulösen.
    -->
    <input id="token" name="token" type="password"
           autocomplete="current-password"
           autofocus required
           placeholder="aus zugang_cli --anlegen">
    <button type="submit">Anmelden</button>
  </form>

  <p class="fuss">
    Kein Token? Wer den Dienst betreibt, legt einen an.
  </p>
</main>
</body>
</html>
