# Die Prüfung, die bei jedem Push läuft.
#
# Ohne sie sind die Tests eine Zusage und keine Prüfung — genau die Lage, in
# der ein Syntaxfehler drei Monate überlebt hat.
#
# Der pre-commit-Hook taugt dafür nicht, und zwar aus zwei Gründen. Er lief
# lange gar nicht: bis September 2026 übersprang er seinen Playwright-Teil,
# wenn kein Server auf 8765 lief, also fast immer. Das ist behoben
# (playwright.config.js fährt ihn selbst hoch). Der zweite Grund bleibt: ein
# Hook läuft nur bei dem, der von Hand committet, und nur auf dessen Maschine.
name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Erst übersetzen: ein Syntaxfehler soll auffallen, auch wenn er in
      # einer Datei steckt, die kein Test importiert.
      #
      # src/generalized/ ist absichtlich nicht dabei: dort steckt seit
      # 2026-05-15 ein Syntaxfehler in parse_document.parse_presseartikel()
      # (typografische Anführungszeichen statt gerader). Ihn zu beheben ist
      # eine Entscheidung über das alte System, keine Nebenwirkung dieser
      # Prüfung. Sobald er behoben ist, gehört 'src' hier wieder hin.
      - name: Übersetzen
        run: python -m compileall -q src/neu tests

      - name: Tests
        run: python -m pytest tests/ -q -m "not langsam" --ignore=tests/test_e2e.py

  frontend:
    name: npm run check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Die Typen kommen sonst aus dem laufenden Server. In der Prüfung gibt
      # es keinen — geprüft wird gegen die eingecheckte api-typen.ts, und
      # genau das ist der Punkt: weicht sie vom Schema ab, bricht der Build.
      - name: Typen und Svelte prüfen
        run: npm run check

      - run: npm run build

  viz:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Der webServer-Block in playwright.config.js startet
      # `python3 -m http.server 8765` aus der Wurzel. ubuntu-latest bringt ein
      # python3 mit; hier steht es trotzdem, damit die Abhängigkeit sichtbar
      # ist und nicht davon lebt, was das Abbild gerade dabeihat.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # --with-deps holt die Systembibliotheken dazu, die Chromium auf einem
      # nackten Runner braucht. Nur chromium: die Tests laufen in keinem
      # zweiten Browser, und Firefox und WebKit wären zwei Downloads, die
      # nichts prüfen.
      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      # Kein data/neu.db, kein Sprachmodell, kein Einbetter. Gelaufen wird
      # gegen data/exporte/pruefstueck/ — einen eingefrorenen ber-Export, der
      # im Verzeichnisbaum liegt. Der Dienst dahinter ist ein Dateiserver.
      #
      # Was von außen kommt: viz/index.html holt d3 und marked von
      # cdn.jsdelivr.net. Ist der nicht erreichbar, wird dieser Job rot, ohne
      # dass am Quelltext etwas falsch wäre.
      - name: Browsertests
        run: npx playwright test

      # Nur wenn etwas schiefging: der Bericht sagt, welcher Klick wo hängen
      # blieb. Ein grüner Lauf braucht ihn nicht.
      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7
